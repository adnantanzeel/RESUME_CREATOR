<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Resume Builder - Sign Up</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
</head>

<body>
    <div class="animated-bg"></div>

    <div class="container">
        <div
            style="min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 40px 20px;">
            <div class="glass-card" style="max-width: 500px; width: 100%;">
                <div class="text-center mb-3">
                    <h1>✨ Resume Builder</h1>
                    <p style="color: var(--text-secondary); font-size: 1.1rem;">
                        Join thousands creating perfect resumes
                    </p>
                </div>

                <div id="alertContainer"></div>

                <form id="signupForm">
                    <h2 class="mb-2">Create Account</h2>

                    <div class="form-group">
                        <label for="username">Username</label>
                        <input type="text" id="username" name="username" placeholder="Choose a username" required
                            minlength="3">
                    </div>

                    <div class="form-group">
                        <label for="email">Email Address</label>
                        <input type="email" id="email" name="email" placeholder="your.email@example.com" required>
                    </div>

                    <div class="form-group">
                        <label for="password">Password</label>
                        <input type="password" id="password" name="password" placeholder="Create a strong password"
                            required minlength="6">
                        <small style="color: var(--text-muted); font-size: 0.85rem;">
                            Minimum 6 characters
                        </small>
                    </div>

                    <div class="form-group">
                        <label for="confirmPassword">Confirm Password</label>
                        <input type="password" id="confirmPassword" name="confirmPassword"
                            placeholder="Re-enter your password" required>
                    </div>

                    <button type="submit" class="btn btn-primary" style="width: 100%;">
                        Create Account
                    </button>
                </form>

                <div class="text-center mt-3">
                    <p style="color: var(--text-secondary);">
                        Already have an account?
                        <a href="index.html" style="font-weight: 600;">Login</a>
                    </p>
                </div>
            </div>
        </div>
    </div>

    <script src="js/auth.js"></script>
    <script>
        // Handle signup form submission
        document.getElementById('signupForm').addEventListener('submit', async (e) => {
            e.preventDefault();

            const username = document.getElementById('username').value;
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            const confirmPassword = document.getElementById('confirmPassword').value;

            // Validate password match
            if (password !== confirmPassword) {
                showAlert('Passwords do not match', 'error');
                return;
            }

            await signup(username, email, password);
        });
    </script>
</body>

</html>
