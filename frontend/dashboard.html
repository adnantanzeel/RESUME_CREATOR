<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Resume Builder - Dashboard</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        .dashboard-container {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 30px;
            margin-top: 30px;
        }

        .form-section {
            max-height: calc(100vh - 200px);
            overflow-y: auto;
            padding-right: 15px;
        }

        .form-section::-webkit-scrollbar {
            width: 8px;
        }

        .form-section::-webkit-scrollbar-track {
            background: rgba(255, 255, 255, 0.05);
            border-radius: 10px;
        }

        .form-section::-webkit-scrollbar-thumb {
            background: var(--neon-cyan);
            border-radius: 10px;
        }

        .preview-section {
            position: sticky;
            top: 100px;
            max-height: calc(100vh - 120px);
            overflow-y: auto;
        }

        .section-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            padding-bottom: 10px;
            border-bottom: 2px solid var(--neon-cyan);
        }

        .entry-item {
            background: rgba(255, 255, 255, 0.03);
            padding: 20px;
            border-radius: 12px;
            margin-bottom: 15px;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .btn-small {
            padding: 8px 16px;
            font-size: 0.85rem;
        }

        .action-buttons {
            display: flex;
            gap: 15px;
            margin-top: 30px;
            flex-wrap: wrap;
        }

        .resume-preview {
            background: white;
            color: #333;
            padding: 40px;
            border-radius: 12px;
            font-family: 'Times New Roman', serif;
            line-height: 1.6;
        }

        .resume-preview h1 {
            color: #1a1a1a;
            font-size: 2rem;
            margin-bottom: 5px;
            background: none;
            -webkit-text-fill-color: initial;
        }

        .resume-preview h2 {
            color: #2c3e50;
            font-size: 1.2rem;
            border-bottom: 2px solid #3498db;
            padding-bottom: 5px;
            margin-top: 20px;
            margin-bottom: 10px;
        }

        .resume-preview h3 {
            color: #34495e;
            font-size: 1rem;
            margin-bottom: 3px;
        }

        .resume-preview p {
            margin: 5px 0;
            color: #555;
        }

        .resume-preview ul {
            margin: 10px 0;
            padding-left: 20px;
        }

        .resume-preview li {
            margin: 5px 0;
            color: #555;
        }

        @media (max-width: 1024px) {
            .dashboard-container {
                grid-template-columns: 1fr;
            }

            .preview-section {
                position: static;
                max-height: none;
            }
        }
    </style>
</head>

<body>
    <div class="animated-bg"></div>

    <!-- Navbar -->
    <nav class="navbar">
        <div class="navbar-brand">✨ Resume Builder</div>
        <div class="navbar-menu">
            <span id="userDisplay" style="color: var(--text-secondary);"></span>
            <button onclick="logout()" class="btn btn-outline btn-small">Logout</button>
        </div>
    </nav>

    <div class="container">
        <div id="alertContainer" style="margin-top: 20px;"></div>

        <div class="dashboard-container">
            <!-- Form Section -->
            <div class="form-section">
                <div class="glass-card">
                    <h2>Build Your Resume</h2>

                    <form id="resumeForm">
                        <!-- Personal Information -->
                        <div class="section-header">
                            <h3>📋 Personal Information</h3>
                        </div>

                        <div class="form-group">
                            <label for="fullName">Full Name *</label>
                            <input type="text" id="fullName" placeholder="John Doe" required>
                        </div>

                        <div class="grid grid-2">
                            <div class="form-group">
                                <label for="email">Email *</label>
                                <input type="email" id="email" placeholder="john@example.com" required>
                            </div>

                            <div class="form-group">
                                <label for="phone">Phone *</label>
                                <input type="tel" id="phone" placeholder="+1 234 567 8900" required>
                            </div>
                        </div>

                        <div class="grid grid-2">
                            <div class="form-group">
                                <label for="location">Location</label>
                                <input type="text" id="location" placeholder="City, Country">
                            </div>

                            <div class="form-group">
                                <label for="linkedin">LinkedIn</label>
                                <input type="url" id="linkedin" placeholder="linkedin.com/in/yourprofile">
                            </div>
                        </div>

                        <div class="form-group">
                            <label for="portfolio">Portfolio/Website</label>
                            <input type="url" id="portfolio" placeholder="https://yourportfolio.com">
                        </div>

                        <!-- Professional Summary -->
                        <div class="section-header">
                            <h3>💼 Professional Summary</h3>
                        </div>

                        <div class="form-group">
                            <label for="summary">Summary</label>
                            <textarea id="summary" rows="4"
                                placeholder="Brief professional summary highlighting your key strengths and career objectives..."></textarea>
                        </div>

                        <!-- Work Experience -->
                        <div class="section-header">
                            <h3>🏢 Work Experience</h3>
                            <button type="button" onclick="addExperience()" class="btn btn-primary btn-small">+
                                Add</button>
                        </div>

                        <div id="experienceContainer"></div>

                        <!-- Education -->
                        <div class="section-header">
                            <h3>🎓 Education</h3>
                            <button type="button" onclick="addEducation()" class="btn btn-primary btn-small">+
                                Add</button>
                        </div>

                        <div id="educationContainer"></div>

                        <!-- Skills -->
                        <div class="section-header">
                            <h3>⚡ Skills</h3>
                        </div>

                        <div class="form-group">
                            <label for="technicalSkills">Technical Skills</label>
                            <input type="text" id="technicalSkills"
                                placeholder="JavaScript, Python, React, etc. (comma-separated)">
                            <small style="color: var(--text-muted);">Separate skills with commas</small>
                        </div>

                        <div class="form-group">
                            <label for="softSkills">Soft Skills</label>
                            <input type="text" id="softSkills"
                                placeholder="Leadership, Communication, Problem Solving, etc. (comma-separated)">
                        </div>

                        <!-- Projects -->
                        <div class="section-header">
                            <h3>🚀 Projects</h3>
                            <button type="button" onclick="addProject()" class="btn btn-primary btn-small">+
                                Add</button>
                        </div>

                        <div id="projectsContainer"></div>

                        <!-- Certifications -->
                        <div class="section-header">
                            <h3>🏆 Certifications</h3>
                            <button type="button" onclick="addCertification()" class="btn btn-primary btn-small">+
                                Add</button>
                        </div>

                        <div id="certificationsContainer"></div>

                        <!-- Action Buttons -->
                        <div class="action-buttons">
                            <button type="button" onclick="saveResume()" class="btn btn-primary">💾 Save Resume</button>
                            <button type="button" onclick="downloadPDF()" class="btn btn-secondary">📥 Download
                                PDF</button>
                            <button type="button" onclick="clearForm()" class="btn btn-outline">🔄 Clear Form</button>
                        </div>
                    </form>
                </div>
            </div>

            <!-- Preview Section -->
            <div class="preview-section">
                <div class="glass-card">
                    <h2 style="margin-bottom: 20px;">👁️ Live Preview</h2>
                    <div id="resumePreview" class="resume-preview">
                        <p style="text-align: center; color: #999;">Start filling the form to see your resume preview...
                        </p>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="js/auth.js"></script>
    <script src="js/resume.js"></script>
    <script src="js/preview.js"></script>
    <script src="js/pdf.js"></script>
    <script>
        // Initialize dashboard
        let currentUser = null;
        let currentResumeId = null;

        async function initDashboard() {
            currentUser = await protectPage();
            if (currentUser) {
                document.getElementById('userDisplay').textContent = `Hello, ${currentUser.username}!`;

                // Add one experience and education by default
                addExperience();
                addEducation();

                // Load existing resume if any
                await loadLatestResume();
            }
        }

        // Initialize on page load
        initDashboard();
    </script>
</body>

</html>
